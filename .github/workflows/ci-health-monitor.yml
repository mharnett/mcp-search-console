name: CI Health Monitor

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

jobs:
  # Dependency audit. scripts/npm-audit-gate.mjs fails this job on a high or
  # critical advisory that scripts/npm-audit-ignores.json does not name, on an
  # ignore past its date, and on an audit that failed or came back empty.
  #
  # Every tick, not once a week: a run that skipped the audit would be green
  # and hide the red one before it. Its own job, so a finding neither fails
  # the CI check below nor trips its dead-man's switch, and so it gets no
  # secret and no write permission.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # No npm ci: the audit reads package-lock.json only, so nothing is
      # installed and no package code runs.
      - run: node scripts/npm-audit-gate.mjs

  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Healthcheck — signal start
        run: |
          # `|| true` used to swallow a rejected ping. When HC_PING_KEY was
          # revoked on 2026-08-23 this workflow kept reporting success for two
          # days while its own dead-man's-switch sat dead — the check only went
          # `down` because the daily standing-failures digest noticed. A 4xx is
          # OUR misconfiguration (bad/revoked key) and must fail loudly; a 5xx
          # or a timeout is hc-ping's problem and stays a warning.
          CODE=$(curl -m 10 -sS -o /dev/null -w '%{http_code}' \
            "https://hc-ping.com/${{ secrets.HC_PING_KEY }}/${{ github.event.repository.name }}-ci/start?create=1" || echo 000)
          echo "hc-ping start -> HTTP $CODE"
          case "$CODE" in
            2*) ;;
            4*) echo "::error::hc-ping rejected the ping (HTTP $CODE) — HC_PING_KEY is invalid or revoked; this monitor's dead-man's-switch is NOT armed."
                exit 1 ;;
            *)  echo "::warning::hc-ping unreachable (HTTP $CODE) — treating as transient, not failing the job." ;;
          esac

      - name: Check for sustained CI failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Get the latest completed run on main
          LATEST_CONCLUSION=$(gh api \
            "repos/${REPO}/actions/workflows/test.yml/runs?branch=main&per_page=1" \
            --jq '.workflow_runs[0].conclusion // empty')

          if [ "$LATEST_CONCLUSION" != "failure" ]; then
            echo "CI is not currently failing (conclusion: ${LATEST_CONCLUSION:-in_progress})"

            # Close any open alert issue since CI is healthy
            OPEN=$(gh issue list --repo "${REPO}" --label "ci-failure-alert" --state open --json number --jq '.[0].number // empty')
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --repo "${REPO}" --comment "CI is green again — closing alert."
              echo "Closed alert issue #$OPEN"
            fi
            exit 0
          fi

          # Find the most recent successful run to calculate downtime
          LAST_SUCCESS=$(gh api \
            "repos/${REPO}/actions/workflows/test.yml/runs?branch=main&per_page=50" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | .[0].created_at // empty')

          NOW=$(date +%s)
          if [ -z "$LAST_SUCCESS" ]; then
            HOURS_FAILING=9999
          else
            LAST_SUCCESS_TS=$(date -d "$LAST_SUCCESS" +%s)
            HOURS_FAILING=$(( (NOW - LAST_SUCCESS_TS) / 3600 ))
          fi

          echo "CI has been failing for ~${HOURS_FAILING}h (threshold: 48h)"

          if [ "$HOURS_FAILING" -lt 48 ]; then
            echo "Under threshold, no alert needed"
            exit 0
          fi

          # Deduplicate: don't open a second issue if one is already open
          EXISTING=$(gh issue list --repo "${REPO}" --label "ci-failure-alert" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Alert issue #$EXISTING already open, skipping"
            exit 0
          fi

          # Create the label if it doesn't exist
          gh label create "ci-failure-alert" --repo "${REPO}" --color "B60205" --description "CI has been failing for >48h" 2>/dev/null || true

          LAST_SUCCESS_DISPLAY=${LAST_SUCCESS:-"unknown (no recent success found)"}

          gh issue create \
            --repo "${REPO}" \
            --title "CI has been failing for ${HOURS_FAILING}h" \
            --label "ci-failure-alert" \
            --body "## CI on \`main\` has been failing for ~${HOURS_FAILING} hours

          **Last successful run:** ${LAST_SUCCESS_DISPLAY}
          **Workflow:** https://github.com/${REPO}/actions/workflows/test.yml

          This issue was opened automatically. It will close when CI goes green."

      - name: Healthcheck — signal result (dead-man's-switch on this monitor)
        if: always()
        run: |
          SUFFIX=""
          [ "${{ job.status }}" != "success" ] && SUFFIX="/fail"
          CODE=$(curl -m 10 -sS -o /dev/null -w '%{http_code}' \
            "https://hc-ping.com/${{ secrets.HC_PING_KEY }}/${{ github.event.repository.name }}-ci${SUFFIX}?create=1" || echo 000)
          echo "hc-ping ${SUFFIX:-/success} -> HTTP $CODE"
          case "$CODE" in
            2*) ;;
            4*) echo "::error::hc-ping rejected the ping (HTTP $CODE) — HC_PING_KEY is invalid or revoked; this monitor's dead-man's-switch is NOT armed."
                exit 1 ;;
            *)  echo "::warning::hc-ping unreachable (HTTP $CODE) — treating as transient, not failing the job." ;;
          esac
